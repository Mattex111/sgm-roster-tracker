<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3b341"/>
      <stop offset="100%" stop-color="#f8e3a1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.8"/>

  <!-- Glowing Emblem / Skull & Star Motifs -->
  <g transform="translate(256, 230) scale(1.1)">
    <!-- Star Base -->
    <path d="M0 -110 L28 -32 L110 -32 L44 18 L68 96 L0 48 L-68 96 L-44 18 L-110 -32 L-28 -32 Z" fill="url(#starGrad)" filter="drop-shadow(0px 8px 16px rgba(227, 179, 65, 0.4))"/>

    <!-- Inner Skull Motif Silhouette -->
    <path d="M-30 -30 C-30 -55 30 -55 30 -30 C30 -10 20 10 20 20 L-20 20 C-20 10 -30 -10 -30 -30 Z" fill="#161b22"/>
    <circle cx="-12" cy="-25" r="7" fill="#e3b341"/>
    <circle cx="12" cy="-25" r="7" fill="#e3b341"/>
    <path d="M-8 5 L-8 15 M0 5 L0 15 M8 5 L8 15" stroke="#e3b341" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text Label Badge -->
  <rect x="80" y="380" width="352" height="64" rx="32" fill="#21262d" stroke="#30363d" stroke-width="4"/>
  <text x="256" y="423" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="28" text-anchor="middle" letter-spacing="2">SGM TRACKER</text>
</svg>
